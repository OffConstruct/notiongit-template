{%- assign home = site.data.home -%}
<footer class="ink-footer hu-footer">
  <div class="hu-bar hu-footer-inner">
    <p class="hu-copy">&copy; {{ 'now' | date: '%Y' }} {{ home.name | strip | default: site.author.name | default: site.title }}</p>
    {%- if home.social_links.size > 0 %}
    <ul class="hu-links" aria-label="Listen and contact">
      {%- for link in home.social_links %}
      <li><a href="{{ link.url }}">{{ link.name }}</a></li>
      {%- endfor %}
    </ul>
    {%- endif %}
  </div>
</footer>
