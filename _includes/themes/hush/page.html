<div class="ink-page hu-wrap">
  <header class="hu-page-head">
    <h1 class="hu-title">{{ page.title }}</h1>
    {%- if page.description and page.description != "" %}
    <p class="hu-lede">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="page-content hu-prose">
    {{ content }}
  </div>
</div>
