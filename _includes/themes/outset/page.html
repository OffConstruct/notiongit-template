<div class="ink-page ot-shell ot-article">
  <header class="ot-post-head">
    <h1 class="ot-title">{{ page.title }}</h1>
    {%- if page.description and page.description != "" %}
    <p class="ot-dek">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="page-content ot-prose ot-body">
    {{ content }}
  </div>
</div>
