{%- assign mq_name = site.data.home.name | default: site.author.name | default: site.title -%}
<footer class="ink-footer mq-footer">
  <div class="mq-wrap mq-footer-inner">
    <p class="mq-footer-name">&copy; {{ 'now' | date: '%Y' }} {{ mq_name }}</p>
    {%- if site.data.home.social_links.size > 0 %}
    <ul class="mq-footer-links" aria-label="Elsewhere">
      {%- for link in site.data.home.social_links %}
      <li><a href="{{ link.url }}">{{ link.name }}</a></li>
      {%- endfor %}
    </ul>
    {%- endif %}
  </div>
</footer>
