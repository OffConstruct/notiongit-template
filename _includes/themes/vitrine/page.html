<article class="ink-page vt-wrap vt-page">
  <header class="vt-page-head">
    <h1 class="vt-page-title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="vt-page-lede">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="vt-page-body page-content">
    {{ content }}
  </div>
</article>
