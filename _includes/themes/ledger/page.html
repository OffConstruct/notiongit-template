<div class="ink-page lg-page lg-shell lg-narrow">
  <header class="lg-page-head">
    <h1 class="lg-page-title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="lg-page-desc">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="lg-body">
    {{ content }}
  </div>
</div>
