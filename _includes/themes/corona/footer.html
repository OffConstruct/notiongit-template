{%- assign home = site.data.home -%}
<footer class="ink-footer co-footer">
  <div class="co-footer-inner">
    {%- if home.social_links.size > 0 %}
    <ul class="co-links" aria-label="Elsewhere">
      {%- for link in home.social_links %}
      <li><a href="{{ link.url }}">{{ link.name }}</a></li>
      {%- endfor %}
    </ul>
    {%- endif %}
    <p class="co-copy">&copy; {{ 'now' | date: '%Y' }} {{ home.name | strip | default: site.author.name | default: site.title }}</p>
  </div>
</footer>
