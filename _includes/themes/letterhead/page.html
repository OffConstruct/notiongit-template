<div class="ink-page lh-page lh-grid">
  <div class="lh-body">
    <h1 class="lh-title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="lh-dek">{{ page.description }}</p>
    {%- endif %}
    <div class="page-content lh-prose">
      {{ content | replace: '<table>', '<div class="lh-table" role="region" aria-label="Table" tabindex="0"><table>' | replace: '</table>', '</table></div>' }}
    </div>
  </div>
</div>
