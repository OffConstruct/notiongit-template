{%- assign home = site.data.home -%}
<footer class="ink-footer cf-footer">
  <div class="cf-wrap cf-footer-inner">
    <p class="cf-footer-name"><a href="{{ '/' | relative_url }}">{{ home.name | default: site.author.name | default: site.title }}</a></p>
    {%- if home.social_links.size > 0 %}
    <ul class="cf-footer-links" aria-label="Elsewhere">
      {%- for link in home.social_links %}
      <li><a href="{{ link.url }}">{{ link.name }}</a></li>
      {%- endfor %}
    </ul>
    {%- endif %}
    <p class="cf-footer-year">&copy; {{ 'now' | date: '%Y' }}</p>
  </div>
</footer>
