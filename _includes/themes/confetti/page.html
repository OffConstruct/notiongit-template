<article class="ink-page cf-wrap cf-page">
  <header class="cf-page-head">
    <h1 class="cf-page-title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="cf-page-lede">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="cf-post-body page-content">
    {{ content }}
  </div>
</article>
