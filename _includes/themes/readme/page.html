<div class="ink-page rd-page rd-frame">
  <article class="rd-article">
    <header class="rd-page-head">
      <h1 class="rd-page-title">{{ page.title }}</h1>
      {%- if page.description %}
      <p class="rd-standfirst">{{ page.description }}</p>
      {%- endif %}
    </header>
    <div class="rd-prose rd-body">
      {{ content }}
    </div>
  </article>
</div>
