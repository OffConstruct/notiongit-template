<footer class="ink-footer spec-footer">
  <div class="spec-wrap">
    <div class="spec-strip spec-strip--foot">
      <p class="spec-cell spec-cell--wide">&copy; {{ 'now' | date: '%Y' }} {{ site.data.home.name | default: site.author.name | default: site.title }}</p>
      <p class="spec-cell"><a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></p>
      <p class="spec-cell spec-colophon">Set in Rethink Sans, IBM Plex Sans and Azeret Mono</p>
    </div>
  </div>
</footer>
