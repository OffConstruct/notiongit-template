<div class="ink-page byline-page">
  <article>
    <header class="byline-page-head">
      <h1 class="byline-page-title">{{ page.title }}</h1>
      {%- if page.description %}
      <p class="byline-standfirst">{{ page.description }}</p>
      {%- endif %}
    </header>
    <div class="page-content">
      {{ content }}
    </div>
  </article>
</div>
