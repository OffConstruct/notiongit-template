<div class="ink-page pt-page">
  <article class="pt-article">
    <header class="pt-post-head">
      <h1 class="pt-post-title">{{ page.title }}</h1>
      {%- if page.description %}
      <p class="pt-standfirst">{{ page.description }}</p>
      {%- endif %}
    </header>
    <div class="pt-prose pt-body">
      {{ content }}
    </div>
  </article>
</div>
