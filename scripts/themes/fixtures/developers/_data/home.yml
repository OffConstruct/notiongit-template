  I build small, dependable tools and write about how they work. Most of my
  time goes into [Tidewatch]({{BASEURL}}/projects/), a tide-prediction library
  used by harbour offices and sailing clubs. Read the [notes]({{BASEURL}}/blog/)
  or see [what I am working on now]({{BASEURL}}/now/).

  ## Work

  Ten years of web and data work, mostly for small public organisations. I
  like boring technology, good error messages and documentation people read.

