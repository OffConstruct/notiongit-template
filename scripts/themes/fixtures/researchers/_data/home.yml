bio: |
  I study how coastal aquifers respond to tides and storms, pairing a century of
  hand-copied harbour records with a small network of new sensors. I am a
  postdoctoral fellow at the North Coast Institute for Marine Science, working
  with the Estuaries Group. Read the [notes]({{BASEURL}}/blog/) or the
  [publications]({{BASEURL}}/publications/).

  ## Research

  My thesis reconstructed groundwater levels under a tidal town from 1890 to
  1910 using the harbour office's own tide tables. Current work asks how those
  levels change when the sea wall is repaired, and who notices first.

